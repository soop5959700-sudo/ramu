<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>라무 LAMU</title>
    <link rel="icon" type="image/jpeg" href="https://profile.img.sooplive.co.kr/LOGO/59/5959700/5959700.jpg" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #160f0d; overflow: hidden; }
      #stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #site { display: block; border: 0; background: #160f0d; transform-origin: top left; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="stage"><iframe id="site" scrolling="no" title="라무 LAMU"></iframe></div>
    <script>
      /* One measurement, one assignment, then nothing moves again.
         No observers, no timers, no messages to the parent: the SOOP app reloads the post
         whenever the embedded frame keeps changing after load. */
      (function () {
        var DESIGN = 1180;   /* layout width handed to the site (smaller = bigger type) */
        var WIDE = 980;      /* at or above this the site is shown 1:1 */

        var pages = ['profile', 'schedule', 'song', 'work', 'diary', 'dress'];
        var m = /[?&]p=([a-z]+)/.exec(location.search);
        var start = (m && pages.indexOf(m[1]) > -1) ? '../' + m[1] + '/?in=1' : '../index.html?in=1';

        var frame = document.getElementById('site');
        var w = document.documentElement.clientWidth || window.innerWidth || DESIGN;
        var h = document.documentElement.clientHeight || window.innerHeight || 2500;

        if (w < WIDE) {
          var scale = w / DESIGN;
          frame.style.width = DESIGN + 'px';
          frame.style.height = Math.round(h / scale) + 'px';
          frame.style.transform = 'scale(' + scale + ')';
        }
        frame.src = start;
      })();
    </script>
  </body>
</html>
