    <style>
      .cal-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
      .cal-nav { display: flex; align-items: center; gap: 14px; }
      .cal-btn { display: inline-flex; width: 40px; height: 40px; align-items: center; justify-content: center; color: var(--white); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line); border-radius: 50%; font-size: 16px; cursor: pointer; transition: var(--transition); }
      .cal-btn:hover { color: var(--ink); background: var(--peach); }
      .cal-title { min-width: 150px; font-family: var(--hand); font-size: calc(clamp(28px, 2.4vw, 38px) * var(--fs-title, 1)); font-weight: 700; letter-spacing: -0.04em; text-align: center; }
      .cal-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; color: rgba(255, 253, 250, 0.55); font-size: 12px; font-weight: 700; }
      .cal-legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 3px; vertical-align: 0; }
      .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid rgba(255, 255, 255, 0.22); border-left: 1px solid rgba(255, 255, 255, 0.1); }
      .cal-dow { padding: 9px 4px; color: var(--peach); border-right: 1px solid rgba(255, 255, 255, 0.1); font-size: calc(11px * var(--fs-label, 1)); font-weight: 900; letter-spacing: 0.12em; text-align: center; }
      .cal-dow:first-child { color: var(--pink-hot); }
      .cal-cell { position: relative; min-height: clamp(66px, 7.2vw, 112px); padding: 6px 6px 7px; overflow: hidden; border-top: 1px solid rgba(255, 255, 255, 0.14); border-right: 1px solid rgba(255, 255, 255, 0.1); }
      .cal-cell.hasband { overflow: visible; }
      .cal-cell.has { cursor: pointer; transition: background var(--transition); }
      .cal-cell.has:hover { background: rgba(255, 210, 154, 0.07); }
      .cal-cell.other { opacity: 0.3; }
      .cal-date { display: inline-flex; width: 24px; height: 24px; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 800; }
      .cal-cell.today .cal-date { color: var(--ink); background: var(--peach); border-radius: 50%; }
      .cal-cell.hl::after { position: absolute; top: 7px; right: 7px; font-size: 11px; content: "⭐"; }
      .ev { margin-top: 3px; overflow: hidden; padding: 2px 6px; border-radius: 6px; font-size: 11px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
      /* Band spans cells. Negative margin must equal cell padding(6) + border(1). */
      .band { position: relative; z-index: 1; height: 20px; margin: 3px -7px 0 -7px; overflow: hidden; padding: 1px 6px; font-size: 11px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
      .band.b-start { margin-left: 0; border-radius: 6px 0 0 6px; }
      .band.b-end { margin-right: 0; border-radius: 0 6px 6px 0; }
      .band.b-start.b-end { border-radius: 6px; }
      .cal-grid > .cal-cell:nth-child(7n) .band { margin-right: 0; }
      .cal-grid > .cal-cell:nth-child(7n + 1) .band { margin-left: 0; }
      .c-green { color: var(--ink); background: #9ed9b5; }
      .c-pink { color: var(--ink); background: #ffb7c1; }
      .c-yellow { color: var(--ink); background: #ffe08a; }
      .c-orange { color: var(--ink); background: #ffc08a; }
      .c-blue { color: var(--ink); background: #a8cdf0; }
      .c-purple { color: var(--ink); background: #cbb3ef; }
      .c-red { color: var(--ink); background: #ff9d94; }
      .c-gray { color: var(--ink); background: #cfc6bd; }
      .sched-stack { display: grid; gap: 22px; }
      .up-list { display: grid; gap: 10px; }
      .up-item { display: grid; grid-template-columns: 96px 1fr auto auto; align-items: center; gap: 14px; padding: 13px 16px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; cursor: pointer; transition: var(--transition); }
      .up-item:nth-child(odd) { transform: rotate(-0.35deg); }
      .up-item:nth-child(even) { transform: rotate(0.3deg); }
      .up-item:hover { border-color: rgba(255, 210, 154, 0.5); transform: none; }
      .up-d1 { color: var(--peach); font-size: 13px; font-weight: 900; letter-spacing: 0.04em; }
      .up-title { overflow: hidden; font-size: calc(15px * var(--fs-body, 1)); font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
      .up-time { color: rgba(255, 253, 250, 0.55); font-size: 12.5px; font-weight: 700; }
      .up-badge { padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 900; }
      .m-date { margin-bottom: 12px; font-family: var(--hand); font-size: 27px; font-weight: 700; letter-spacing: -0.03em; }
      .m-badge { display: inline-flex; margin-bottom: 10px; padding: 3px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 900; }
      .m-part { display: grid; grid-template-columns: 84px 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.09); }
      .m-part .pt { color: var(--peach); font-size: 13px; font-weight: 900; }
      .m-part .pn { font-size: 15px; font-weight: 700; }
      .m-desc { margin-top: 12px; color: rgba(255, 253, 250, 0.75); font-size: 14px; line-height: 1.75; white-space: pre-wrap; }
      .m-close { display: inline-flex; min-height: 42px; align-items: center; margin-top: 16px; padding: 0 20px; color: var(--ink); background: var(--peach); border: 0; border-radius: 999px; font-size: 14px; font-weight: 900; cursor: pointer; }
      @media (max-width: 680px) {
        .ev, .band span { font-size: 10px; }
        .up-item { grid-template-columns: 84px 1fr auto; }
        .up-time { display: none; }
        .cal-cell { min-height: 60px; }
      }
    </style>

    <script>
      /* schedule — contract: 기능배선_카테고리 §2 (calendar, band, upcoming, modal) */
      let currentYear, currentMonth, allSchedule = [];
      const DAYS = ['일','월','화','수','목','금','토'];
      function kind(t) { return t === '휴방' ? 'off' : 'on'; }
      function colorClass(s) { return 'c-' + (s.color || (kind(s.type) === 'off' ? 'pink' : 'green')); }

      async function init() {
        const now = new Date(); currentYear = now.getFullYear(); currentMonth = now.getMonth();
        allSchedule = await fetchAll('schedule', { order: 'date', asc: true });
        renderCalendar(); renderUpcoming(); enableIframeAutoHeight();
      }
      function changeMonth(d) {
        currentMonth += d;
        if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
        renderCalendar(); enableIframeAutoHeight();
      }
      function renderCalendar() {
        document.getElementById('calTitle').textContent = `${currentYear}년 ${currentMonth + 1}월`;
        const grid = document.getElementById('calGrid');
        const first = new Date(currentYear, currentMonth, 1);
        const last  = new Date(currentYear, currentMonth + 1, 0);
        const startDay = first.getDay();
        const today = new Date();
        let html = DAYS.map(d => `<div class="cal-dow">${d}</div>`).join('');
        const prevLast = new Date(currentYear, currentMonth, 0).getDate();
        for (let i = startDay - 1; i >= 0; i--) html += `<div class="cal-cell other"><span class="cal-date">${prevLast - i}</span></div>`;
        for (let d = 1; d <= last.getDate(); d++) {
          const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const isToday = today.getFullYear() === currentYear && today.getMonth() === currentMonth && today.getDate() === d;
          const events = allSchedule.filter(s => s.date <= dateStr && dateStr <= (s.end_date || s.date));
          const hl = events.some(e => e.highlight);
          let bandUsed = false;   /* one band per cell */
          let evHtml = events.map(e => {
            const ranged = e.end_date && e.end_date !== e.date;
            if (ranged) {
              if (bandUsed) return '';
              bandUsed = true;
              const caps = (dateStr === e.date ? ' b-start' : '') + (dateStr === e.end_date ? ' b-end' : '');
              const btxt = (e.time ? e.time + ' ' : '') + (e.title || (kind(e.type) === 'off' ? '휴방' : '방송'));
              return `<div class="band${caps} ${colorClass(e)}">${dateStr === e.date ? `<span>${esc(btxt)}</span>` : ''}</div>`;
            }
            const label = (e.time ? e.time + ' ' : '') + (e.title || (kind(e.type) === 'off' ? '휴방' : '방송'));
            return `<div class="ev ${colorClass(e)}" title="${esc(label)}">${esc(label)}</div>`;
          }).join('');
          const cls = `cal-cell${isToday ? ' today' : ''}${events.length ? ' has' : ''}${hl ? ' hl' : ''}${bandUsed ? ' hasband' : ''}`;
          const click = events.length ? `onclick="openModal('${dateStr}')"` : '';
          html += `<div class="${cls}" ${click}><span class="cal-date">${d}</span>${evHtml}</div>`;
        }
        const totalCells = startDay + last.getDate();
        const rem = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
        for (let i = 1; i <= rem; i++) html += `<div class="cal-cell other"><span class="cal-date">${i}</span></div>`;
        grid.innerHTML = html;
      }
      function renderUpcoming() {
        const today = new Date().toISOString().split('T')[0];
        const upcoming = allSchedule.filter(s => (s.end_date || s.date) >= today).slice(0, 12);
        const el = document.getElementById('upcoming');
        if (!upcoming.length) { el.innerHTML = '<div class="empty"><span class="empty-icon">🌰</span>다가오는 일정이 아직 없어요</div>'; return; }
        el.innerHTML = upcoming.map(s => {
          const dd = new Date(s.date + 'T00:00:00'); const k = kind(s.type);
          const label = k === 'off' ? '휴방' : '방송';
          const times = [s.time, s.time2].filter(Boolean).join(' · ');
          return `<div class="up-item" onclick="openModal('${s.date}')">
            <span class="up-d1">${String(dd.getMonth() + 1).padStart(2, '0')}-${String(dd.getDate()).padStart(2, '0')} (${DAYS[dd.getDay()]})</span>
            <span class="up-title">${esc(s.title || label)}</span>
            ${times ? `<span class="up-time">${esc(times)}</span>` : ''}
            <span class="up-badge ${colorClass(s)}">${label}</span>
          </div>`;
        }).join('');
      }
      function openModal(dateStr) {
        const events = allSchedule.filter(s => s.date === dateStr);
        if (!events.length) return;
        const dd = new Date(dateStr + 'T00:00:00');
        let html = `<div class="m-date">${dateStr} (${DAYS[dd.getDay()]})</div>`;
        events.forEach(s => {
          const k = kind(s.type);
          html += `<div class="m-badge ${colorClass(s)}">${k === 'off' ? '휴방' : '방송'}</div>`;
          html += `<div class="m-part"><div class="pt">${s.time ? esc(s.time) : '1부'}</div><div class="pn">${esc(s.title || (k === 'off' ? '휴방' : '방송'))}</div></div>`;
          if (s.title2 || s.time2) html += `<div class="m-part"><div class="pt">${s.time2 ? esc(s.time2) : '2부'}</div><div class="pn">${esc(s.title2 || '방송')}</div></div>`;
          if (s.description) html += `<div class="m-desc">${esc(s.description)}</div>`;
        });
        html += `<button class="m-close" onclick="closeModal()">닫기</button>`;
        document.getElementById('modal-body').innerHTML = html;
        document.getElementById('ovbg').classList.add('show');
        placeOverlay(document.getElementById('ov'));
      }
      function closeModal() {
        document.getElementById('ov').classList.remove('show');
        document.getElementById('ovbg').classList.remove('show');
      }
      init();
    </script>
