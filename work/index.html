    <style>
      .work-tools { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; margin-bottom: 18px; }
      .work-tools .form-control { min-height: 46px; }
      .update-date { color: rgba(255, 253, 250, 0.5); font-size: 12.5px; font-weight: 800; letter-spacing: 0.06em; }
      .viewer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 14px; }
      .viewer-card { display: grid; justify-items: center; gap: 8px; padding: 20px 12px 16px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: var(--radius-md); text-align: center; cursor: pointer; transition: var(--transition); }
      .viewer-card:hover { background: rgba(255, 210, 154, 0.07); border-color: rgba(255, 210, 154, 0.4); }
      .viewer-av, .viewer-av-fb { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255, 235, 215, 0.35); }
      .viewer-av-fb { display: flex; align-items: center; justify-content: center; color: var(--ink); background: var(--pink); font-family: var(--hand); font-size: 26px; font-weight: 700; }
      .viewer-nick { overflow: hidden; max-width: 100%; font-size: calc(14.5px * var(--fs-body, 1)); font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
      .viewer-id { overflow: hidden; max-width: 100%; color: rgba(255, 253, 250, 0.42); font-size: 11.5px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
      .viewer-total { display: inline-flex; align-items: center; gap: 4px; padding: 4px 11px; color: var(--ink); background: var(--peach); border-radius: 999px; font-size: 12px; font-weight: 900; }
      .modal-top { display: flex; align-items: center; gap: 13px; margin-bottom: 14px; }
      .modal-av, .modal-av-fb { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255, 235, 215, 0.35); }
      .modal-av-fb { display: flex; align-items: center; justify-content: center; color: var(--ink); background: var(--pink); font-family: var(--hand); font-size: 22px; font-weight: 700; }
      .modal-nick { font-size: 18px; font-weight: 900; }
      .modal-id { color: rgba(255, 253, 250, 0.45); font-size: 12px; font-weight: 600; }
      .modal-x { display: inline-flex; width: 36px; height: 36px; align-items: center; justify-content: center; margin-left: auto; color: var(--white); background: rgba(255, 255, 255, 0.07); border: 1px solid var(--line); border-radius: 50%; font-size: 14px; cursor: pointer; }
      .upbo-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.09); }
      .upbo-row:last-child { border-bottom: 0; }
      .upbo-row .nm { flex: 1; font-size: calc(14.5px * var(--fs-body, 1)); font-weight: 700; }
      .upbo-row .evb { padding: 2px 9px; color: #7a5410; background: #ffe4ad; border-radius: 999px; font-size: 10px; font-weight: 900; }
      .upbo-row .ct { color: var(--peach); font-size: 15px; font-weight: 900; }
      .modal-empty { padding: 22px 0 8px; color: rgba(255, 253, 250, 0.5); font-size: 14px; font-weight: 700; text-align: center; }
      @media (max-width: 640px) { .work-tools { grid-template-columns: 1fr; } .viewer-grid { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); } }
    </style>

    <script>
      if (localStorage.getItem('theme') === 'light') document.body.classList.add('light');
      try { if (window.self !== window.top) document.body.classList.add('embed'); }
      catch (e) { document.body.classList.add('embed'); }

      /* A phone renders this page at the 1180px layout width above and scales it down.
         Mark that case: the cover must lock to 16:9 instead of following the tall visual viewport. */
      (function () {
        if (document.body.classList.contains('embed')) return;   /* the wrapper handles that case */
        try {
          var screenW = (window.screen && window.screen.width) || window.innerWidth;
          if (window.innerWidth > screenW + 40) {
            document.body.classList.add('fit');
            /* the cover page pins html/body to the viewport height; at this layout width that
               would leave a long empty tail under the cover */
            var d = document.documentElement;
            d.style.height = 'auto'; d.style.overflow = 'visible';
            document.body.style.height = 'auto'; document.body.style.overflow = 'visible';
          }
        } catch (e) {}
      })();

    </script>

    <script>
      /* upbo — contract: 기능배선_카테고리 §3 (card grid + detail modal, no table matrix) */
      let viewers = [], types = [], counts = [];
      async function init() {
        [viewers, types, counts] = await Promise.all([
          fetchAll('viewers',     { order: 'sort_order', asc: true }),
          fetchAll('upbo_types',  { order: 'sort_order', asc: true }),
          fetchAll('upbo_counts', { order: 'id',         asc: true })
        ]);
        const latest = counts.reduce((m, c) => c.updated_at && c.updated_at > m ? c.updated_at : m, '');
        document.getElementById('update-date').textContent = latest ? 'UPDATED · ' + latest.slice(0, 10) : '';
        render(viewers); enableIframeAutoHeight();
      }
      function viewerTotal(vid) { return counts.filter(c => c.viewer_id === vid && c.count > 0).reduce((s, c) => s + c.count, 0); }
      function avHtml(v, cls) {
        const av = soopAvatar(v.soop_id); const ini = esc((v.nickname || '?').charAt(0));
        return av ? `<img class="${cls}" src="${av}" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=\\'${cls}-fb\\'>${ini}</div>'">`
                  : `<div class="${cls}-fb">${ini}</div>`;
      }
      function render(list) {
        const grid = document.getElementById('grid');
        if (!list.length) { grid.innerHTML = '<div class="empty"><span class="empty-icon">🐿️</span>장부에 오른 토리가 아직 없어요</div>'; enableIframeAutoHeight(); return; }
        grid.innerHTML = list.map(v => `<div class="viewer-card" onclick="openModal(${v.id})">
            ${avHtml(v, 'viewer-av')}
            <div class="viewer-nick">${esc(v.nickname)}</div>
            ${v.soop_id ? `<div class="viewer-id">(${esc(v.soop_id)})</div>` : '<div class="viewer-id">&nbsp;</div>'}
            <span class="viewer-total">🌰 업보 ${viewerTotal(v.id)}</span>
          </div>`).join('');
        enableIframeAutoHeight();
      }
      function openModal(vid) {
        const v = viewers.find(x => x.id === vid); if (!v) return;
        document.getElementById('modal-top').innerHTML = `${avHtml(v, 'modal-av')}
          <div><div class="modal-nick">${esc(v.nickname)}</div>${v.soop_id ? `<div class="modal-id">(${esc(v.soop_id)})</div>` : ''}</div>
          <button class="modal-x" onclick="closeModal()">✕</button>`;
        const my = {}; counts.filter(c => c.viewer_id === vid).forEach(c => { my[c.type_id] = c.count; });
        const rows = types.filter(t => (my[t.id] || 0) > 0).map(t => `<div class="upbo-row">
            <span class="nm">${esc(t.name)}</span>
            ${t.category === '이벤트' ? '<span class="evb">이벤트</span>' : ''}
            <span class="ct">×${my[t.id]}</span>
          </div>`).join('');
        document.getElementById('modal-body').innerHTML = rows || '<div class="modal-empty">아직 쌓인 업보가 없어요. 착한 토리 🌱</div>';
        document.getElementById('ovbg').classList.add('show');
        placeOverlay(document.getElementById('ov'));
      }
      function closeModal() {
        document.getElementById('ov').classList.remove('show');
        document.getElementById('ovbg').classList.remove('show');
      }
      document.getElementById('search').addEventListener('input', e => {
        const q = e.target.value.trim().toLowerCase();
        render(viewers.filter(v => (v.nickname || '').toLowerCase().includes(q) || (v.soop_id || '').toLowerCase().includes(q)));
      });
      init();
    </script>
