      .song-stack { display: grid; gap: 22px; }
      .song-tools { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-bottom: 16px; }
      .song-tools .form-control { min-height: 46px; }
      .rand-slip { position: relative; display: none; margin-bottom: 18px; padding: 20px 22px 18px; color: var(--ink); background: #fffaf3; border: 1px solid rgba(255, 255, 255, 0.96); box-shadow: 0 18px 44px rgba(10, 5, 3, 0.34); }
      .rand-slip.show { display: block; }
      .rand-slip::before { position: absolute; z-index: 2; top: -12px; left: 34px; width: 72px; height: 22px; background: linear-gradient(90deg, rgba(255, 206, 165, 0.55), rgba(255, 242, 207, 0.92), rgba(255, 193, 181, 0.56)); border: 1px solid rgba(255, 255, 255, 0.4); content: ""; transform: rotate(-2deg); }
      .rand-kicker { color: #b96a2e; font-size: 11px; font-weight: 900; letter-spacing: 0.18em; }
      .rand-title { margin-top: 6px; font-family: var(--hand); font-size: calc(clamp(26px, 2.2vw, 34px) * var(--fs-title, 1)); font-weight: 700; letter-spacing: -0.03em; }
      .rand-artist { margin-top: 2px; color: #7b6152; font-size: 14px; font-weight: 700; }
      .rand-slip.rolling .rand-title, .rand-slip.rolling .rand-artist { filter: blur(1.5px); opacity: 0.6; }
      .rand-slip.hit { animation: slipPop 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.4); }
      @keyframes slipPop { 0% { transform: scale(0.97) rotate(-0.6deg); } 100% { transform: scale(1) rotate(0); } }
      .rand-actions { display: flex; gap: 8px; margin-top: 14px; }
      .rand-actions .mini { display: inline-flex; min-height: 38px; align-items: center; padding: 0 15px; color: var(--ink); background: var(--peach); border: 0; border-radius: 999px; font-size: 13px; font-weight: 900; cursor: pointer; }
      .rand-actions .mini.ghost { color: #5a4436; background: transparent; border: 1.5px solid rgba(90, 68, 54, 0.3); }
      .gt-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
      .gt { display: inline-flex; min-height: 38px; align-items: center; padding: 0 16px; color: rgba(255, 253, 250, 0.66); background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); border-radius: 999px; font-size: 13.5px; font-weight: 800; cursor: pointer; transition: var(--transition); }
      .gt:hover { background: rgba(255, 255, 255, 0.12); }
      .gt.active { color: var(--ink); background: var(--peach); border-color: transparent; }
      .song-count { margin-bottom: 12px; color: rgba(255, 253, 250, 0.5); font-size: 12.5px; font-weight: 800; letter-spacing: 0.06em; }
      .song-head, .song-row { display: grid; grid-template-columns: 44px minmax(0, 1.3fr) minmax(0, 0.9fr) 96px 118px; align-items: center; gap: 12px; }
      .song-head { padding: 0 14px 10px; color: var(--peach); border-bottom: 1px solid rgba(255, 255, 255, 0.22); font-size: calc(11px * var(--fs-label, 1)); font-weight: 900; letter-spacing: 0.14em; }
      .song-row { padding: 12px 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); transition: background var(--transition); }
      .song-row:hover { background: rgba(255, 210, 154, 0.06); }
      .s-num { color: rgba(255, 253, 250, 0.4); font-size: 12.5px; font-weight: 800; }
      .s-title { overflow: hidden; font-size: calc(15px * var(--fs-body, 1)); font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
      .s-artist { overflow: hidden; color: rgba(255, 253, 250, 0.62); font-size: calc(13.5px * var(--fs-body, 1)); font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
      .s-genre { justify-self: start; padding: 3px 10px; color: var(--pink); background: rgba(252, 196, 197, 0.12); border-radius: 999px; font-size: 11.5px; font-weight: 800; white-space: nowrap; }
      .s-diff { display: flex; gap: 2px; }
      .s-diff .dot { font-size: 13px; opacity: 0.18; filter: grayscale(1); }
      .s-diff .dot.on { opacity: 1; filter: none; }
      @media (max-width: 760px) {
        .song-tools { grid-template-columns: 1fr; }
        .song-head { display: none; }
        .song-row { grid-template-columns: 30px minmax(0, 1fr) 92px; grid-template-areas: "num title diff" "num artist genre"; row-gap: 3px; }
        .s-num { grid-area: num; }
        .s-title { grid-area: title; }
        .s-artist { grid-area: artist; }
        .s-genre { grid-area: genre; justify-self: end; }
        .s-diff { grid-area: diff; justify-self: end; }
      }
    </style>

    <script>
      if (localStorage.getItem('theme') === 'light') document.body.classList.add('light');
      try { if (window.self !== window.top) document.body.classList.add('embed'); }
      catch (e) { document.body.classList.add('embed'); }

      /* A phone renders this page at the 1180px layout width above and scales it down.
         Mark that case: the cover must lock to 16:9 instead of following the tall visual viewport. */
      (function () {
        if (document.body.classList.contains('embed')) return;   /* the wrapper handles that case */
        try {
          var screenW = (window.screen && window.screen.width) || window.innerWidth;
          if (window.innerWidth > screenW + 40) {
            document.body.classList.add('fit');
            /* the cover page pins html/body to the viewport height; at this layout width that
               would leave a long empty tail under the cover */
            var d = document.documentElement;
            d.style.height = 'auto'; d.style.overflow = 'visible';
            document.body.style.height = 'auto'; document.body.style.overflow = 'visible';
          }
        } catch (e) {}
      })();

    </script>

    <script>
      /* song book — contract: 기능배선_카테고리 §5. GENRES must match the admin genre select. */
      const GENRES = ['전체','K-Pop','J-Pop','팝','싱잉랩','어쿠스틱','기타'];
      const PAGE = 30;
      let songs = [], curGenre = '전체', curPage = 1, keyword = '';

      async function init() { songs = await fetchAll('songs', { order: 'id', asc: true }); renderGenres(); render(); enableIframeAutoHeight(); }
      function renderGenres() {
        document.getElementById('genre-tabs').innerHTML = GENRES.map(g =>
          `<button class="gt ${g === curGenre ? 'active' : ''}" onclick="selGenre('${g}')">${g}</button>`).join('');
      }
      function selGenre(g) { curGenre = g; curPage = 1; renderGenres(); render(); enableIframeAutoHeight(); }
      function filtered() {
        return songs.filter(s => {
          const okG = curGenre === '전체' || s.genre === curGenre;
          const q = keyword.toLowerCase();
          return okG && (!q || (s.title || '').toLowerCase().includes(q) || (s.artist || '').toLowerCase().includes(q));
        });
      }
      var PICKED = null, rolling = false;
      function showPick(s, isFinal) {
        PICKED = s;
        document.getElementById('randTitle').textContent = s.title || '—';
        document.getElementById('randArtist').textContent = s.artist || '아티스트 미상';
        var box = document.getElementById('randBox');
        box.classList.toggle('rolling', !isFinal);
        if (isFinal) { box.classList.remove('hit'); void box.offsetWidth; box.classList.add('hit'); }
      }
      function rollPick() {
        if (rolling) return;
        var arr = filtered();
        if (!arr.length) { alert('고를 곡이 없어요'); return; }
        document.getElementById('randBox').classList.add('show');
        if (arr.length === 1) { showPick(arr[0], true); return; }
        rolling = true;
        var n = 0, ticks = 14 + Math.floor(Math.random() * 6);
        (function tick() {
          showPick(arr[Math.floor(Math.random() * arr.length)], false);
          n++;
          if (n < ticks) setTimeout(tick, 45 + Math.pow(n / ticks, 3) * 210);
          else { showPick(arr[Math.floor(Math.random() * arr.length)], true); rolling = false; }
        })();
        enableIframeAutoHeight();
      }
      function render() {
        const list = filtered();
        const totalPages = Math.max(1, Math.ceil(list.length / PAGE));
        if (curPage > totalPages) curPage = 1;
        const pageItems = list.slice((curPage - 1) * PAGE, curPage * PAGE);
        document.getElementById('count').textContent = `총 ${list.length}곡 · ${curPage}/${totalPages} 페이지`;
        const body = document.getElementById('song-body');
        if (!list.length) { body.innerHTML = '<div class="empty"><span class="empty-icon">🎤</span>이 칸의 노래가 아직 없어요</div>'; document.getElementById('pagination').innerHTML = ''; return; }
        body.innerHTML = pageItems.map((s, i) => {
          const num = (curPage - 1) * PAGE + i + 1;
          const diff = parseInt(s.difficulty) || 0;
          let dots = ''; for (let k = 1; k <= 5; k++) dots += `<span class="dot${k <= diff ? ' on' : ''}">🌰</span>`;
          return `<div class="song-row" data-song="${esc(s.title)}">
            <span class="s-num">${num}</span>
            <span class="s-title">${esc(s.title)}</span>
            <span class="s-artist">${esc(s.artist) || '-'}</span>
            <span class="s-genre">${esc(s.genre) || '기타'}</span>
            <span class="s-diff">${dots}</span>
          </div>`;
        }).join('');
        const pg = document.getElementById('pagination'); pg.innerHTML = '';
        if (totalPages > 1) for (let i = 1; i <= totalPages; i++) {
          const b = document.createElement('button'); b.className = 'pg' + (i === curPage ? ' active' : ''); b.textContent = i;
          b.onclick = () => { curPage = i; render(); enableIframeAutoHeight(); window.scrollTo(0, 0); };
          pg.appendChild(b);
        }
      }
      document.getElementById('search').addEventListener('input', e => { keyword = e.target.value.trim(); curPage = 1; render(); enableIframeAutoHeight(); });
      document.getElementById('randBtn').addEventListener('click', rollPick);
      document.getElementById('randAgain').addEventListener('click', rollPick);
      document.getElementById('randCopy').addEventListener('click', function () {
        if (!PICKED) return;
        var t = PICKED.title + (PICKED.artist ? ' - ' + PICKED.artist : '');
        if (navigator.clipboard) navigator.clipboard.writeText(t);
      });
      init();
    </script>
